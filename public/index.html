<div id="er"></div><button class="btn" id="sb" style="width:100%;padding:14px">${register?'Зареєструватися':'Увійти'}</button>`;
 $('#fm').onsubmit=submit;$('#nk').oninput=e=>{const counter=$('#nc');if(counter)counter.textContent=e.target.value.length+'/'+NMAX};
 if(register){$('#ag').onclick=e=>{const button=e.target.closest('button');if(button){sel='p'+button.dataset.i;document.querySelectorAll('#ag button').forEach(item=>item.classList.toggle('on',item===button));updateAvatarPreview()}};$('#fi').onchange=pic;$('#p1').oninput=checkPasswords;$('#p2').oninput=checkPasswords;}
}
function eye(){['p1','p2'].forEach(id=>{const el=$('#'+id);if(el)el.type=el.type==='password'?'text':'password'})}
function checkPasswords(){const p=$('#p1').value,q=$('#p2').value,score=(p.length>=6)+(p.length>=10)+(/[a-zа-яіїє]/i.test(p)&&/[A-ZА-ЯІЇЄ]/.test(p))+(/\d/.test(p)&&/[^\w]/.test(p));document.querySelectorAll('.meter i').forEach((el,i)=>el.style.background=i<score?['','var(--rd)','var(--go)','var(--bl)','var(--ac)'][score]:'');const hint=$('#mh');hint.className='hint '+(q?(p===q?'ok':'bad'):'');hint.textContent=q?(p===q?'✓ Паролі збігаються':'Паролі не збігаються'):''}
function updateAvatarPreview(){const holder=document.querySelector('.prev');if(holder)holder.innerHTML=av(sel)+'<div class="mu">Обери готову аватарку або завантаж зображення</div>'}
function pic(event){const file=event.target.files?.[0];if(!file)return;if(file.size>5*1024*1024){toast('Зображення має бути до 5 МБ');return}const image=new Image();image.onload=()=>{const canvas=document.createElement('canvas');canvas.width=canvas.height=128;const ctx=canvas.getContext('2d'),side=Math.min(image.width,image.height);ctx.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,128,128);sel=canvas.toDataURL('image/jpeg',.82);updateAvatarPreview()};image.onerror=()=>toast('Не вдалося відкрити зображення');image.src=URL.createObjectURL(file)}
async function submit(event){event.preventDefault();const register=mode==='reg',nick=$('#nk').value.trim(),password=$('#p1').value,errorBox=$('#er'),button=$('#sb');const showError=message=>{errorBox.innerHTML=`<div class="err shake">${esc(message)}</div>`};
 if(nick.length<2||nick.length>NMAX)return showError('Нік має містити від 2 до '+NMAX+' символів');
 if(password.length<PWMIN||password.length>72)return showError(`Пароль має містити від ${PWMIN} до 72 символів`);
 if(register&&password!==$('#p2').value)return showError('Паролі не збігаються');
 button.disabled=true;button.innerHTML='<span class="spin"></span>Зачекай…';
 try{const result=await api(register?'register':'login',{nick,pw:password,avatar:sel});TK=result.tk;localStorage.setItem('tk',TK);upd(result.me);shell();go('home')}
 catch(error){showError(error.message);button.disabled=false;button.textContent=register?'Зареєструватися':'Увійти'}
}

/* Основний інтерфейс */
const T=[['home','👤','Профіль'],['activity','🧠','Активності'],['cars','🚗','Автосалон'],['inv','🎒','Гараж'],['houses','🏠','Нерухомість'],['biz','🏢','Бізнес'],['top','🏆','Рейтинг'],['adm','🛡️','Адмін'],['set','⚙️','Налаштування']];
const shell=()=>{document.body.innerHTML='<div id="app"><nav id="nav"></nav><main id="m"></main></div><div id="toast"></div>'};
const stat=(label,value)=>`<div class="stat"><span class="mu">${label}</span><b>${value}</b></div>`;
function go(view){cur=view;const menu=T.filter(item=>item[0]!=='adm'||['owner','admin'].includes(M.role));$('#nav').innerHTML='<div class="logo">AFK<b>·</b>BANK</div>'+menu.map(item=>`<button class="${item[0]===view?'on':''}" onclick="go('${item[0]}')"><i>${item[1]}</i>${item[2]}</button>`).join('');const title=T.find(item=>item[0]===view)?.[2]||'AFK Bank';$('#m').innerHTML=`<div class="top"><h1>${title}</h1><div class="me">${av(M.avatar)}<div class="who">${esc(M.nick)}<span>${M.role==='owner'?'Власник':M.role==='admin'?'Адмін':'Гравець'} · рівень ${M.level}</span></div><div class="bal" id="bal">${f(M.bal)} грн</div></div></div>`+(V[view]?.()||'<div class="card">Розділ не знайдено</div>');A[view]?.();scrollTo(0,0)}

const V={
 home(){const next=LV[M.level-1],progress=next?Math.min(100,M.ok/next*100):100;return`<div class="grid">
 <div class="card"><h2>Профіль</h2>${stat('💰 Баланс',f(M.bal)+' грн')}${stat('🚗 Автомобіль',esc(M.car||'немає'))}${stat('🏢 Бізнес',esc(M.biz||'немає'))}${stat('🏠 Дім',esc(M.house||'немає'))}${stat('🔋 Стаміна',M.stam?'безлімітна':'звичайна')}${stat('🚘 Автомобілі в гаражі',M.cars.length+' шт.')}</div>
 <div class="card"><h2>⭐ Рівень ${M.level}</h2><div class="mu">Очки прогресу: ${M.ok}${next?'/'+next:' (максимум)'} · бонуси x${M.mult}</div><div class="bar"><i style="width:${progress}%"></i></div></div>
 <div class="card"><h2>🎁 Щоденний бонус</h2><div class="num" style="font-size:22px;color:var(--go)">${f(50000*M.mult)} грн</div><div class="mu" id="dl"></div><div class="row"><button class="btn" id="db" onclick="daily()">Забрати</button></div></div>
 <div class="card"><h2>🚀 Швидкий перехід</h2><div class="mu">Керуй власним майном і розвивай економіку.</div><div class="row"><button class="btn g" onclick="go('cars')">Автосалон</button><button class="btn g" onclick="go('houses')">Нерухомість</button><button class="btn g" onclick="go('biz')">Бізнес</button></div></div></div>`},
 activity(){return`<div class="grid"><div class="card"><h2>🧠 Фокус-сесія</h2><div class="mu">30 секунд зосередженої роботи. Після завершення отримаєш 5 очок прогресу. Очки не можна ставити або обмінювати на гроші.</div><div class="big" id="focusClock" style="margin:22px 0">00:30</div><div class="bar"><i id="focusBar" style="width:0%"></i></div><div class="mu" id="focusInfo" style="margin-top:12px"></div><div class="row"><button class="btn" id="focusButton" onclick="startFocus()">Почати сесію</button></div></div>
 <div class="card"><h2>📈 Як працює прогрес</h2>${stat('Завершена фокус-сесія','+5 очок')}${stat('Щоденний бонус','раз на 24 години')}${stat('Підвищення рівня','збільшує щоденний бонус')}<p class="mu" style="margin-top:12px">Немає ставок, випадкових виплат чи платного випадкового контенту.</p></div></div>`},
 cars(){return`<div class="card" style="margin-bottom:14px"><h2>🚗 Автосалон</h2><div class="mu">Кожен автомобіль має заздалегідь відому ціну. Обирай модель і купуй напряму — без кейсів та випадкових результатів.</div><div style="margin-top:12px"><input id="carSearch" placeholder="Пошук автомобіля за назвою…" autocomplete="off"></div></div><div class="grid" id="carGrid"></div>`},
 inv(){return`<div class="grid"><div class="card"><h2>🚘 Мій гараж</h2>${M.cars.map(car=>`<div class="car"><span>${esc(car.name)}<div class="mu">Ціна в каталозі: ${f(car.value)} грн</div></span><button class="btn ${M.car===car.name?'g':''}" onclick="selectCar(${car.id})">${M.car===car.name?'Активний':'Обрати'}</button></div>`).join('')||'<div class="mu">Гараж поки порожній. Обери автомобіль в автосалоні.</div>'}</div><div class="card"><h2>📌 Активне майно</h2>${stat('Автомобіль',esc(M.car||'не обрано'))}${stat('Дім',esc(M.house||'не придбано'))}${stat('Бізнес',esc(M.biz||'не придбано'))}</div></div>`},
 houses(){return`<div class="grid">${D.houses.map(house=>`<div class="card"><h2>${esc(house[0])}</h2><div class="num" style="color:var(--go);font-size:16px">${f(house[1])} грн</div><div class="row"><button class="btn ${M.house===house[0]?'g':''}" data-name="${esc(house[0])}" onclick="buy('house',this.dataset.name)">${M.house===house[0]?'Твій дім':'Купити'}</button></div></div>`).join('')}</div>`},
 biz(){return`<div class="grid">${D.biz.map(business=>`<div class="card"><h2>${esc(business[0])}</h2>${stat('Ціна',f(business[1])+' грн')}${stat('Показник бізнесу',f(business[2]))}<div class="row"><button class="btn ${M.biz===business[0]?'g':''}" data-name="${esc(business[0])}" onclick="buy('biz',this.dataset.name)">${M.biz===business[0]?'Твій бізнес':'Купити'}</button></div></div>`).join('')}</div>`},
 top(){return`<div class="pod" id="pod"><div class="card mu">Завантаження…</div></div><div class="card" style="margin-top:14px"><h2>💸 Переказ між гравцями</h2><div class="mu">Відправ віртуальні гривні іншому гравцю за ніком.</div><div class="row"><input id="payTo" placeholder="Нік отримувача" style="flex:1 1 160px"><input id="payAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="Сума" style="flex:1 1 120px"><button class="btn" onclick="pay()">Відправити</button></div></div>`},
 adm(){return`<div class="grid"><div class="card"><h2>🛡️ Керування гравцем</h2><div class="row"><input id="adminNick" placeholder="Нік гравця"><input id="adminAmount" type="number" min="0" step="1" placeholder="Сума"></div><div class="row"><button class="btn" onclick="adminAction('givemoney')">Видати гроші</button><button class="btn g" onclick="adminAction('setmoney')">Встановити баланс</button><button class="btn b" onclick="adminAction('stamina')">🔋 Стаміна</button></div>${M.role==='owner'?`<div class="row"><button class="btn g" onclick="adminAction('giveadmin')">Надати адмін-права</button><button class="btn g" onclick="adminAction('takeadmin')">Забрати адмін-права</button></div><div class="mu">Лише власник може змінювати ролі. Права власника не можна передати або забрати з цієї панелі.</div>`:''}</div><div class="card"><h2>Журнал дій</h2><div id="log" class="mu">Завантаження…</div></div></div>`},
 set(){return`<div class="grid"><div class="card"><h2>🎨 Тема</h2><div class="row"><button class="btn g" onclick="document.documentElement.dataset.theme='dark'">Темна</button><button class="btn g" onclick="document.documentElement.dataset.theme='light'">Світла</button></div></div><div class="card"><h2>🚪 Вихід</h2><div class="row"><button class="btn g" onclick="logout()">Вийти з акаунта</button></div></div><div class="card"><h2>ℹ️ Про сайт</h2><div class="mu">AFK Bank — безпечна віртуальна економічна гра. Покупки мають фіксовану ціну, а всі зміни балансу обробляються сервером.</div></div></div>`}
};

const A={
 home(){const view=++gl;const tick=()=>{const button=$('#db');if(!button||view!==gl)return;const wait=left('daily');button.disabled=wait>0;$('#dl').textContent=wait?'Наступний бонус через '+dur(wait):'Готово до отримання';setTimeout(tick,1000)};tick()},
 activity(){const view=++gl;const tick=async()=>{if(cur!=='activity'||view!==gl)return;const run=left('run'),clock=$('#focusClock'),bar=$('#focusBar'),info=$('#focusInfo'),button=$('#focusButton');if(!clock||!bar||!info||!button)return;
  if(run>0){clock.textContent='00:'+String(Math.ceil(run/1000)).padStart(2,'0');bar.style.width=(1-run/30000)*100+'%';info.textContent='Сесія триває. Залишилося '+dur(run);button.disabled=true;button.textContent='У процесі…'}
  else if(M.cd.pending||M.cd.run>0){button.disabled=true;button.textContent='Зараховуємо…';const result=await call('focusClaim');if(result){upd(result.me);toast('✅ +'+result.points+' очок прогресу');}setTimeout(tick,300);return}
  else{const wait=left('focus');clock.textContent='00:30';bar.style.width='0%';button.disabled=wait>0;button.textContent=wait?'Недоступно':'Почати сесію';info.textContent=wait?'Наступна сесія через '+dur(wait):'Готовий до короткої фокус-сесії'}
  setTimeout(tick,400)};tick()},
 cars(){renderCars();$('#carSearch').oninput=()=>renderCars($('#carSearch').value)},
 top(){call('top').then(result=>{if(!result||cur!=='top')return;const order=[1,0,2].filter(index=>result.top[index]);$('#pod').innerHTML=order.map(index=>{const player=result.top[index];return`<div class="card" style="${index===0?'border-color:var(--go);transform:translateY(-8px)':''}">${av(player.avatar)}<div class="m">${['🥇','🥈','🥉'][index]}</div><b>${esc(player.nick)}</b><div class="mu">${f(player.bal)} грн</div></div>`}).join('')||'<div class="card mu">Поки що немає гравців</div>'})},
 adm(){loadLog()}
};
function renderCars(filter=''){const target=$('#carGrid');if(!target)return;const query=filter.trim().toLocaleLowerCase('uk-UA');const list=D.cars.filter(car=>car.name.toLocaleLowerCase('uk-UA').includes(query));target.innerHTML=list.map(car=>{const owned=M.cars.some(item=>item.name===car.name);return`<div class="card"><h2>${esc(car.name)}</h2><div class="num" style="color:var(--go);font-size:17px">${f(car.value)} грн</div><div class="mu">Фіксована ціна · без випадкових нагород</div><div class="row"><button class="btn ${owned?'g':''}" ${owned?'disabled':''} data-name="${esc(car.name)}" onclick="purchaseCar(this.dataset.name)">${owned?'Уже в гаражі':'Купити'}</button></div></div>`}).join('')||'<div class="card mu">За таким запитом автомобілів не знайдено.</div>'}
async function loadLog(){const result=await call('admin',{op:'log'});if(result&&$('#log'))$('#log').innerHTML=result.log.map(row=>`<div class="stat"><span>${esc(row.admin)}: ${esc(row.text)}</span><b>${new Date(row.at).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</b></div>`).join('')||'Журнал порожній'}
async function daily(){const result=await call('daily');if(result){upd(result.me);toast('🎁 +'+f(result.reward)+' грн');go('home')}}
async function startFocus(){const result=await call('focusStart');if(result){upd(result.me);go('activity')}}
async function purchaseCar(name){const result=await call('buyCar',{name});if(result){upd(result.me);toast('🚗 Автомобіль придбано');go('cars')}}
async function selectCar(id){const result=await call('selectCar',{id});if(result){upd(result.me);go('inv')}}
async function buy(kind,name){const result=await call('buy',{w:kind,n:name});if(result){upd(result.me);toast('✅ Покупку виконано');go(cur)}}
async function pay(){const result=await call('pay',{to:$('#payTo').value,amt:Number($('#payAmount').value)});if(result){upd(result.me);toast('💸 Переказ виконано');go('top')}}
async function adminAction(op){const nick=$('#adminNick')?.value||'',amount=Number($('#adminAmount')?.value||0);const result=await call('admin',{op,nick,n:amount});if(result){upd(result.me);toast('✅ '+result.ok);loadLog()}}
async function logout(){await call('logout');out()}

(async()=>{if(!TK){auth();return}try{const result=await api('me');upd(result.me);shell();go('home')}catch(error){if(!String(error.message).includes('Сесія'))toast(error.message);auth()}})();
</script></body></html>
