 document.querySelectorAll('.meter i').forEach((e,i)=>e.style.background=i<s?['','var(--rd)','var(--go)','var(--bl)','var(--ac)'][s]:'');
 const h=$('#mh');h.className='hint '+(q?(p==q?'ok':'bad'):'');h.textContent=q?(p==q?'✓ Паролі збігаються':'Паролі не збігаються'):''}
function pic(e){const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,128,128);sel=c.toDataURL('image/jpeg',.82);form()};im.onerror=()=>toast('Не вдалося відкрити зображення');im.src=URL.createObjectURL(fl)}
async function submit(e){e.preventDefault();const reg=mode=='reg',nick=$('#nk').value.trim(),pw=$('#p1').value,er=$('#er'),sb=$('#sb'),bad=m=>{er.innerHTML=`<div class="err shake">${m}</div>`};
 if(nick.length<2)return bad('Нік має містити від 2 до '+NMAX+' символів');if(pw.length<PWMIN)return bad('Пароль: мінімум '+PWMIN+' символів');if(reg&&pw!==$('#p2').value)return bad('Паролі не збігаються');
 sb.disabled=true;sb.innerHTML='<span class="spin"></span>Зачекай…';
 try{const j=await api(reg?'register':'login',{nick,pw,avatar:sel});TK=j.tk;localStorage.setItem('tk',TK);upd(j.me);shell();go('home')}catch(x){bad(x.message);sb.disabled=false;sb.textContent=reg?'Зареєструватися':'Увійти'}}
/* ---------- APP ---------- */
const T=[['home','👤','Профіль'],['games','🎲','Ігри'],['case','📦','Кейси'],['inv','🎒','Інвентар'],['houses','🏠','Дім'],['biz','🏢','Бізнес'],['top','🏆','Топ'],['adm','🛡️','Адмін'],['set','⚙️','Ще']];
const shell=()=>{document.body.innerHTML='<div id="app"><nav id="nav"></nav><main id="m"></main></div><div id="toast"></div>'};
const stat=(a,b)=>`<div class="stat"><span class="mu">${a}</span><b>${b}</b></div>`;
const betBox=id=>`<input id="${id}" type="number" inputmode="numeric" min="${MINB}" placeholder="Ставка (від ${MINB})">`;
function go(v){cur=v;const ts=T.filter(t=>t[0]!='adm'||['owner','admin'].includes(M.role));$('#nav').innerHTML='<div class="logo">AFK<b>·</b>BANK</div>'+ts.map(t=>`<button class="${t[0]==v?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');
 const t=T.find(x=>x[0]==v);$('#m').innerHTML=`<div class="top"><h1>${t[2]}</h1><div class="me">${av(M.avatar)}<div class="who">${esc(M.nick)}<span>${M.role=='owner'?'Власник':M.role=='admin'?'Адмін':'Гравець'} · рівень ${M.level}</span></div><div class="bal" id="bal">${f(M.bal)} грн</div></div></div>`+V[v]();A[v]&&A[v]();scrollTo(0,0)}
const V={
home(){const nx=LV[M.level-1],p=nx?Math.min(100,M.ok/nx*100):100;return`<div class="grid"><div class="card"><h2>Профіль</h2>${stat('🍆 Розмір',M.dick+' см')}${stat('💰 Баланс',f(M.bal))}${stat('🚗 Автомобіль',esc(M.car||'немає'))}${stat('🏢 Бізнес',esc(M.biz||'немає'))}${stat('🏠 Дім',esc(M.house||'немає'))}${stat('🔋 Стаміна',M.stam?'безлімітна':'звичайна')}</div>
<div class="card"><h2>⭐ Рівень ${M.level}</h2><div class="mu">Успішних команд: ${M.ok}${nx?'/'+nx:' (максимум)'} · бонуси x${M.mult}</div><div class="bar"><i style="width:${p}%"></i></div></div>
<div class="card"><h2>🎁 Щоденний бонус</h2><div class="num" style="font-size:22px;color:var(--go)">${f(50000*M.mult)} грн</div><div class="mu" id="dl"></div><div class="row"><button class="btn" id="db" onclick="daily()">Забрати</button></div></div></div>`},
games(){return`<div class="grid"><div class="card"><h2>🪙 Coinflip</h2><div class="mu">50/50 · виплата x2 · мін. ставка ${MINB}</div><div class="stage"><div class="coin" id="coin"><div>ОРЕЛ</div><div class="t">РЕШКА</div></div></div><div class="res" id="cr"></div>${betBox('cb')}<div class="row"><button class="btn" onclick="flip('Орел')">🦅 Орел</button><button class="btn g" onclick="flip('Решка')">🪙 Решка</button></div></div>
<div class="card"><h2>🎰 Рулетка</h2><div class="mu">Вгадай число — ставка × коефіцієнт</div><div class="big" id="rn">?</div><div class="res" id="rr"></div>${betBox('rb')}<input id="rg" type="number" inputmode="numeric" placeholder="Твоє число" style="margin-top:8px"><div class="row" id="rl">${D.rl.map((x,i)=>`<button class="btn g" data-i="${i}" onclick="rsel(${i})">${x[3]} ${x[0]}–${x[1]} · X${x[2]}</button>`).join('')}</div><div class="row"><button class="btn b" onclick="roul()">Крутити</button></div></div>
<div class="card"><h2>🍆 /dick</h2><div class="mu">Раз на добу · від −3 до +8 см</div><div class="big" id="dn">${M.dick}</div><div class="res" id="dr"></div><div class="mu" id="dd"></div><div class="row"><button class="btn" onclick="dick()">Спробувати</button></div></div>
<div class="card"><h2>⏳ Бонусна активність</h2><div class="mu">30 с · бонус 5 000–15 000 · раз на 2 години</div><div class="bar"><i id="mb" style="width:0"></i></div><div class="mu" id="md" style="margin-top:8px"></div><div class="row"><button class="btn" id="mbt" onclick="mast()">Почати</button></div></div></div>`},
case(){return`<div class="grid">${Object.entries(D.cases).map(([k,c])=>`<div class="card"><h2>${c.e} ${k}</h2><div class="num" style="color:var(--go);font-size:18px">${f(c.p)} грн</div><div class="mu">У тебе: ${M.cases[k]||0} шт · ${c.c.length} авто</div><div class="row"><button class="btn" onclick="bcase('${k}')">Купити</button><button class="btn g" onclick="ocase('${k}')">Відкрити</button></div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h2>Відкриття</h2><div class="reel" id="reel">Обери кейс</div></div>
<div class="card" style="margin-top:14px"><h2>Шанси</h2><div class="mu">Шанс зменшується разом із вартістю авто. ⭐ — джекпот.</div><div class="row">${Object.keys(D.cases).map(k=>`<button class="btn g" onclick="odds('${k}')">${D.cases[k].e} ${k}</button>`).join('')}</div><div id="od"></div></div>`},
inv(){const cs=Object.entries(M.cases);return`<div class="grid"><div class="card"><h2>📦 Кейси</h2>${cs.map(([k,n])=>stat(D.cases[k].e+' '+k,n+' шт')).join('')||'<div class="mu">Порожньо</div>'}</div><div class="card"><h2>🚗 Автомобілі</h2>${M.cars.map(c=>`<div class="car"><span>${c.jackpot?'<span class=jp>⭐</span> ':''}${esc(c.name)}<div class="mu">${f(c.value)} грн</div></div><button class="btn ${M.car==c.name?'':'g'}" onclick="ucar(${c.id})">${M.car==c.name?'Активне':'Обрати'}</button></div>`).join('')||'<div class="mu">Порожньо</div>'}</div></div>`},
houses(){return`<div class="grid">${D.houses.map(h=>`<div class="card"><h2>${h[0]}</h2><div class="num" style="color:var(--go);font-size:16px">${f(h[1])} грн</div><div class="row"><button class="btn ${M.house==h[0]?'g':''}" onclick="buy('house','${h[0]}')">${M.house==h[0]?'Твій дім':'Купити'}</button></div></div>`).join('')}</div>`},
biz(){return`<div class="grid">${D.biz.map(b=>`<div class="card"><h2>${b[0]}</h2>${stat('Ціна',f(b[1])+' грн')}${stat('Дохід',f(b[2])+' грн')}<div class="row"><button class="btn ${M.biz==b[0]?'g':''}" onclick="buy('biz','${b[0].replace(/'/g,"\\'")}')">${M.biz==b[0]?'Твій бізнес':'Купити'}</button></div></div>`).join('')}</div>`},
top(){return`<div class="pod" id="pod"><div class="card mu">Завантаження…</div></div><div class="card" style="margin-top:14px"><h2>💸 Переказ</h2><div class="mu">Відправ гроші іншому гравцю за ніком</div><div class="row"><input id="pt" placeholder="Нік отримувача" style="flex:1 1 160px"><input id="pa" type="number" inputmode="numeric" placeholder="Сума" style="flex:1 1 120px"><button class="btn" onclick="pay()">Відправити</button></div></div>`},
adm(){return`<div class="grid"><div class="card"><h2>🛡️ Керування гравцем</h2><div class="row"><input id="an" placeholder="Нік"><input id="aa" type="number" placeholder="Значення"></div><div class="row"><button class="btn" onclick="adm('givemoney')">Видати гроші</button><button class="btn g" onclick="adm('setmoney')">Баланс =</button><button class="btn g" onclick="adm('setdick')">Розмір =</button><button class="btn b" onclick="adm('stamina')">🔋 Стаміна</button></div></div><div class="card"><h2>Журнал дій</h2><div id="lg" class="mu">…</div></div></div>`},
set(){return`<div class="grid"><div class="card"><h2>🎨 Тема</h2><div class="row"><button class="btn g" onclick="document.documentElement.dataset.theme='dark'">Темна</button><button class="btn g" onclick="document.documentElement.dataset.theme='light'">Світла</button></div></div><div class="card"><h2>🚪 Вихід</h2><div class="row"><button class="btn g" onclick="call('logout').then(out)">Вийти з акаунта</button></div></div></div>`}};
const A={home(){const L=++gl,t=()=>{const b=$('#db');if(!b||L!=gl)return;const l=left('daily');b.disabled=l>0;$('#dl').textContent=l?'Наступний бонус через '+dur(l):'Готово до отримання';setTimeout(t,1000)};t()},
games(){rsel(0);const L=++gl,t=async()=>{if(cur!='games'||L!=gl)return;const k=left('dick'),md=$('#md'),b=$('#mb'),bt=$('#mbt');$('#dd').textContent=k?'До наступної спроби: '+dur(k):'';
 const run=left('run');if(run>0){b.style.width=(1-run/3e4)*100+'%';md.textContent='Триває… '+Math.ceil(run/1e3)+' с';bt.disabled=true}
 else if(M.cd.pend||M.cd.run>0){M.cd.pend=M.cd.run=0;await sleep(700);const j=await call('mclaim');if(j){upd(j.me);toast('💰 Бонус: +'+f(j.rw)+' грн');b.style.width=0}}
 else{const l=left('mast');bt.disabled=l>0;md.textContent=l?'Наступний раз через '+dur(l):''}setTimeout(t,500)};t()},
top(){call('top').then(j=>{if(!j||cur!='top')return;const o=[1,0,2].filter(i=>j.top[i]);$('#pod').innerHTML=o.map(i=>{const r=j.top[i];return`<div class="card" style="${i==0?'border-color:var(--go);transform:translateY(-8px)':''}">${av(r.avatar)}<div class="m">${['🥇','🥈','🥉'][i]}</div><b>${esc(r.nick)}</b><div class="mu">${f(r.bal)} грн</div></div>`}).join('')||'<div class="card mu">Поки що немає гравців</div>'})},
adm(){alog()}};
async function alog(){const j=await call('adm',{op:'log'});if(j&&$('#lg'))$('#lg').innerHTML=j.log.map(r=>`<div class="stat"><span>${esc(r.admin)}: ${esc(r.text)}</span><b>${new Date(r.at).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}</b></div>`).join('')||'Порожньо'}
const bt=id=>+$('#'+id).value;
async function daily(){const j=await call('daily');if(j){upd(j.me);toast('🎁 +'+f(j.rw)+' грн');go('home')}}
async function flip(c){const e=$('#coin'),b=bt('cb');$('#cr').className='res';$('#cr').textContent='Підкидаю…';const p=call('flip',{bet:b,c});e.style.transition='none';e.style.transform='rotateY(0)';e.offsetWidth;e.style.transition='';const j=await p;if(!j){$('#cr').textContent='';return}
 e.style.transform=`rotateY(${1800+(j.r=='Решка'?180:0)}deg)`;await sleep(2000);upd(j.me);$('#cr').className='res '+(j.w?'win':'lose');$('#cr').textContent=(j.w?'🎉 Виграш +':'💥 Програш −')+f(j.win)+' · '+j.r}
let rs=0;const rsel=i=>{rs=i;document.querySelectorAll('#rl .btn').forEach(x=>x.classList.toggle('g',x.dataset.i!=i))};
async function roul(){const[lo,hi]=D.rl[rs],n=$('#rn');const p=call('roul',{bet:bt('rb'),g:bt('rg'),t:rs});const j=await p;if(!j)return;for(let i=0;i<18;i++){n.textContent=rnd(lo,hi);await sleep(60+i*12)}n.textContent=j.r;n.classList.remove('pop','shake');n.offsetWidth;n.classList.add(j.w?'pop':'shake');upd(j.me);$('#rr').className='res '+(j.w?'win':'lose');$('#rr').textContent=j.w?`🎉 +${f(j.win)}`:'💥 Не вгадав'}
async function dick(){const j=await call('dick');if(!j)return;upd(j.me);const n=$('#dn');n.textContent=M.dick;n.classList.add('pop');$('#dr').className='res '+(j.c>=0?'win':'lose');$('#dr').textContent=(j.c>0?'+':'')+j.c+' см'}
async function mast(){const j=await call('mstart');if(j)upd(j.me)}
async function bcase(k){const j=await call('bcase',{k});if(j){upd(j.me);toast('Куплено: '+k);go('case')}}
async function ocase(k){const p=call('ocase',{k}),r=$('#reel'),c=D.cases[k].c;r.classList.remove('hit');const j=await p;if(!j)return;for(let i=0;i<22;i++){r.textContent=c[rnd(0,16)][0];await sleep(50+i*14)}upd(j.me);const x=j.car;r.classList.add('hit');r.innerHTML=(x[2]?'<span class="jp">🎰 ДЖЕКПОТ!</span><br>':'')+esc(x[0])+'<br><span class="mu">'+f(x[1])+' грн</span>'}
const odds=k=>{$('#od').innerHTML=D.cases[k].c.map((x,i)=>`<div class="car"><span>${x[2]?'⭐ ':''}${x[0]}<div class="mu">${f(x[1])} грн</div></div><b>${((17-i)/153*100).toFixed(2)}%</b></div>`).join('')};
async function ucar(id){const j=await call('ucar',{id});if(j){upd(j.me);go('inv')}}
async function buy(w,n){const j=await call('buy',{w,n});if(j){upd(j.me);go(cur)}}
async function pay(){const j=await call('pay',{to:$('#pt').value,amt:bt('pa')});if(j){upd(j.me);toast('💸 Переказ виконано');go('top')}}
async function adm(op){const j=await call('adm',{op,nick:$('#an').value,n:bt('aa')});if(j){upd(j.me);toast('✅ '+j.ok);alog()}}
(async()=>{if(!TK)return auth();try{const j=await api('me');upd(j.me);shell();go('home')}catch(e){TK&&e.message.includes('Сесія')?0:toast(e.message);auth()}})();

</script></body></html>
