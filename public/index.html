.gm-note{font-size:12px;color:var(--mu);margin-top:16px}.gm-result{font:800 clamp(18px,3vw,24px) Unbounded;margin-top:18px;min-height:30px}.gm-points{font:800 18px Unbounded;color:var(--ac);margin-top:8px}.gm-input{max-width:320px;margin:16px auto 0;text-align:center;font:800 20px Unbounded}
.coin-stage{height:250px;display:grid;place-items:center;perspective:1000px;margin:8px auto}.coin-disk{width:144px;height:144px;position:relative;transform-style:preserve-3d}.coin-disk.flipping{animation:coinToss 2.1s cubic-bezier(.15,.7,.18,1) both}.coin-side{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;border:7px solid #b98720;background:radial-gradient(circle at 32% 26%,#fff2a6,#e8ac22 58%,#a76a08);color:#704600;font:800 17px Unbounded;box-shadow:0 22px 44px #b987203d,inset 0 0 0 3px #fff4}.coin-side.back{transform:rotateY(180deg);background:radial-gradient(circle at 30% 25%,#c3f3ff,#4aa3cc 65%,#195579);border-color:#317c9c;color:#063e59}

function modalBase(type,icon,title,subtitle,body){
 const root=$('#gameModal');if(!root)return;
 root.innerHTML=`<section class="game-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="gm-wrap"><header class="gm-top"><div class="gm-brand"><div class="gm-icon">${icon}</div><div><h2>${esc(title)}</h2><div class="mu">${esc(subtitle)}</div></div></div><button class="gm-close" onclick="closeMiniGame()">✕ Закрити</button></header><main class="gm-main" id="gmMain">${body}</main></div></section>`;
}
function closeMiniGame(){if(MINI_POLL){clearInterval(MINI_POLL);MINI_POLL=null}MINI_TYPE=null;ACTIVE_GAME=null;const root=$('#gameModal');if(root)root.innerHTML=''}
function openMiniGame(type){
 if(!['coin','cookie','guess','solo'].includes(type)){toast('Ця гра недоступна');return}
 if(MINI_POLL){clearInterval(MINI_POLL);MINI_POLL=null}MINI_TYPE=type;MATCH_HINT={};
 if(type==='coin') renderCoinSetup();
 else if(type==='solo') renderSoloSetup();
 else {renderMatchShell(type);refreshMatches();MINI_POLL=setInterval(refreshMatches,1500)}
}
function renderCoinSetup(){modalBase('coin','🪙','Монетка','50 / 50 · без ставок та винагород',`<section class="gm-panel"><div class="gm-title">Що випаде цього разу?</div><p class="gm-sub">Обери сторону, а потім подивись на повноекранний кидок монетки.</p><div class="gm-actions"><button class="gm-choice" onclick="runCoin('heads')">🦅 Орел</button><button class="gm-choice" onclick="runCoin('tails')">🌙 Решка</button></div><p class="gm-note">Без ставок і грошових втрат. Це лише безкоштовна візуальна гра — без ставок, виплат або бонусів.</p></section>`)}
async function runCoin(prediction){const result=await call('gamesStart',{game:'coin',prediction});if(!result)return;ACTIVE_GAME=result.challenge;
 const label=prediction==='heads'?'Орел':'Решка';
 $('#gmMain').innerHTML=`<section class="gm-panel"><div class="gm-title">Монетка вже в повітрі…</div><p class="gm-sub">Твій прогноз: ${label}</p><div class="coin-stage"><div class="coin-disk flipping" id="coinDisk"><div class="coin-side">ОРЕЛ</div><div class="coin-side back">РЕШКА</div></div></div><div class="gm-result" id="coinResult">Кидаємо…</div></section>`;
 const challengeId=ACTIVE_GAME.id;await sleep(2150);if(MINI_TYPE!=='coin'||!$('#gmMain'))return;const finished=await call('gamesFinish',{id:challengeId});if(!finished)return;upd(finished.me);const side=finished.result.side==='heads'?'ОРЕЛ':'РЕШКА';const disk=$('#coinDisk');if(disk){disk.classList.remove('flipping');disk.style.transform=finished.result.side==='heads'?'rotateY(0deg)':'rotateY(180deg)'}
 $('#gmMain').innerHTML=`<section class="gm-panel"><div class="gm-title">${finished.correct?'🎉 Ти вгадав!':'Кидок завершено'}</div><div class="coin-stage"><div class="coin-disk" style="transform:rotateY(${finished.result.side==='heads'?0:180}deg)"><div class="coin-side">ОРЕЛ</div><div class="coin-side back">РЕШКА</div></div></div><div class="gm-result">Випало: ${side}</div><div class="gm-points">Безкоштовний кидок — без грошових чи інших винагород</div><div class="gm-actions"><button class="btn" onclick="renderCoinSetup()">Кинути ще раз</button><button class="btn g" onclick="closeMiniGame()">До розділів</button></div></section>`;ACTIVE_GAME=null}
const SOLO_LEVELS=[['easy','Легко','1–3','+3 XP','Відгадай число від 1 до 3'],['medium','Середньо','1–5','+5 XP','Відгадай число від 1 до 5'],['hard','Важко','1–10','+8 XP','Відгадай число від 1 до 10'],['impossible','Неможливо','1–50','+12 XP','Відгадай число від 1 до 50']];
function renderSoloSetup(){modalBase('solo','🔢','Вгадай число','Соло-режим · тренування логіки',`<section class="gm-panel"><div class="gm-title">Обери складність</div><p class="gm-sub">Секретне число обирає сервер. Підказки «більше» і «менше» допоможуть знайти відповідь. За успіх нараховуються лише очки прогресу.</p><div class="solo-levels">${SOLO_LEVELS.map(x=>`<button class="solo-level" onclick="startSoloGuess('${x[0]}')"><b>${x[1]}</b><span>${x[2]}</span><small>${x[3]}</small></button>`).join('')}</div><p class="gm-note">Жодних ставок, грошових виплат або плати за спробу.</p></section>`)}
async function startSoloGuess(difficulty){const r=await call('soloGuessStart',{difficulty});if(!r)return;ACTIVE_GAME=r;const title=SOLO_LEVELS.find(x=>x[0]===difficulty);$('#gmMain').innerHTML=`<section class="gm-panel"><span class="tag">${title[1]} · ${title[2]}</span><div class="gm-title" style="margin-top:12px">Знайди секретне число</div><p class="gm-sub">Спроб: ${r.maxAttempts}. Винагорода за успіх: ${r.xpReward} XP.</p><div class="solo-attempts" id="soloAttempts">0 / ${r.maxAttempts} спроб</div><div class="solo-number-grid">${Array.from({length:r.rangeMax},(_,i)=>i+1).map(n=>`<button onclick="soloGuessPick(${n})">${n}</button>`).join('')}</div><div class="gm-result" id="soloHint">Обери число від 1 до ${r.rangeMax}.</div><div class="gm-actions"><button class="btn g" onclick="renderSoloSetup()">Змінити складність</button></div></section>`}
async function soloGuessPick(guess){if(!ACTIVE_GAME?.id)return;const r=await call('soloGuessTry',{id:ACTIVE_GAME.id,guess});if(!r)return;if(r.me)upd(r.me);const hint=$('#soloHint'),attempts=$('#soloAttempts');if(attempts)attempts.textContent=`${r.attempts} / ${r.maxAttempts} спроб`;
 if(r.correct){if(hint)hint.innerHTML=`<span class="win">🎉 Правильно! Ти знайшов число ${r.answer}. +${r.xp} XP</span>`;document.querySelectorAll('.solo-number-grid button').forEach(b=>b.disabled=true);$('#gmMain').insertAdjacentHTML('beforeend',`<div class="gm-actions"><button class="btn" onclick="renderSoloSetup()">Ще раунд</button><button class="btn g" onclick="closeMiniGame()">Закрити</button></div>`);toast(`Перемога! +${r.xp} XP`);return}
 if(r.finished){if(hint)hint.innerHTML=`<span class="lose">Спроби закінчилися. Правильне число: ${r.answer}.</span>`;document.querySelectorAll('.solo-number-grid button').forEach(b=>b.disabled=true);$('#gmMain').insertAdjacentHTML('beforeend',`<div class="gm-actions"><button class="btn" onclick="renderSoloSetup()">Спробувати ще</button><button class="btn g" onclick="closeMiniGame()">Закрити</button></div>`);return}
 if(hint)hint.textContent=r.hint==='higher'?'Потрібне число більше ↑':'Потрібне число менше ↓';const button=[...document.querySelectorAll('.solo-number-grid button')].find(b=>Number(b.textContent)===guess);if(button){button.disabled=true;button.classList.add('picked')}
}
function renderMatchShell(type){const cookie=type==='cookie';modalBase(type,cookie?'🍪':'🔢',cookie?'Печенька':'Вгадай число',cookie?'Матч із другом · 60 секунд':'Тактика · 1–30',`<section class="gm-panel"><div class="gm-title">${cookie?'Змагайся на швидкість':'Хто першим знайде число?'}</div><p class="gm-sub">${cookie?'Введи нік друга та надішли запрошення. Після прийняття у вас буде 60 секунд.':'Надішли запрошення другу. Кожен таємно обере число від 1 до 30, потім ви ходитимете по черзі.'}</p><div class="row" style="max-width:500px;margin:20px auto 0"><input id="challengeNick" placeholder="Нік друга" autocomplete="off"><button class="btn" onclick="createMatch('${type}')">Кинути виклик</button></div></section><section class="gm-panel"><div class="gm-brand" style="justify-content:space-between"><div><h2>${cookie?'Запрошення та матчі':'Твої матчі'}</h2><div class="mu">Список оновлюється автоматично</div></div><button class="btn g" onclick="refreshMatches()">↻ Оновити</button></div><div class="gm-match-list" id="matchList"><div class="gm-empty">Завантаження…</div></div></section>`)}

function renderMatchCards(matches,type){const list=$('#matchList');if(!list)return;matches=matches.filter(x=>x.game===type);const gameName=type==='cookie'?'Печенька':'Вгадай число';
 let html='';
 for(const m of matches.filter(x=>x.status==='pending'&&x.incoming))html+=`<div class="match-card"><b>📩 Запрошення · ${gameName} #${m.id}</b><div class="mu">Від гравця ${esc(m.creator)}</div><div class="row"><button class="btn" onclick="respondMatch(${m.id},'accept')">Прийняти</button><button class="btn g" onclick="respondMatch(${m.id},'reject')">Відхилити</button></div></div>`;
 for(const m of matches.filter(x=>x.status==='pending'&&!x.incoming))html+=`<div class="match-card"><b>⏳ Запрошення #${m.id} надіслано</b><div class="mu">Очікуємо відповідь від ${esc(m.opponent)}</div></div>`;
 for(const m of matches.filter(x=>x.status==='active')){
   if(type==='cookie'){
     const left=Math.max(0,Math.ceil((new Date(m.endsAt).getTime()-Date.now())/1000));
     html+=`<div class="match-card"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>🍪 Матч #${m.id}</b><span class="tag">${left} с</span></div><div class="cookie-arena"><div class="score-box"><span class="mu">Ти</span><b>${m.myScore}</b></div><div class="score-box"><span class="mu">${esc(m.creatorMe?m.opponent:m.creator)}</span><b>${m.otherScore}</b></div></div><div style="text-align:center"><button class="cookie-button" ${left<=0?'disabled':''} onclick="tapCookie(${m.id},this)">🍪</button><p class="gm-note">Тапай по печеньці якомога швидше!</p></div></div>`;
   }else if(m.status==='choosing'){
     html+=`<div class="match-card"><b>🔒 Матч #${m.id} · вибір секретного числа</b><div class="mu" style="margin-top:8px">${m.mySecretSet?'Твоє число збережено. Чекаємо, поки суперник обере своє.':'Обери число від 1 до 30. Суперник не побачить твій вибір.'}</div>${m.mySecretSet?'':`<div class="number-grid">${Array.from({length:30},(_,i)=>i+1).map(n=>`<button onclick="chooseGuessSecret(${m.id},${n})">${n}</button>`).join('')}</div>`}</div>`;
   }else{
     const turn=m.myTurn?'<span class="ok">Твій хід</span>':'Хід суперника';
     html+=`<div class="match-card"><div class="row" style="justify-content:space-between;margin:0"><b>🔢 Матч #${m.id}</b><span class="tag">${turn}</span></div><div class="mu" style="margin-top:8px">${m.myTurn?'Вгадай секретне число друга.':'Суперник думає над твоїм числом…'}</div><div class="gm-result" style="font-size:16px">${esc(MATCH_HINT[m.id]||'')||'Підказки з’являться після спроби.'}</div><div class="number-grid">${Array.from({length:30},(_,i)=>i+1).map(n=>`<button ${!m.myTurn?'disabled':''} onclick="guessMatchNumber(${m.id},${n})">${n}</button>`).join('')}</div></div>`;
   }
 }
 for(const m of matches.filter(x=>x.status==='completed'))html+=`<div class="match-card"><b>${m.game==='cookie'?'🍪':'🔢'} Матч #${m.id} · завершено</b><div class="mu">${m.winner?'Переможець: '+esc(m.winner):'Нічия'}</div>${m.game==='cookie'?`<div class="mu">Рахунок: ${m.myScore} : ${m.otherScore}</div>`:''}<div class="gm-note">${m.winner===M.nick?'+5 очок прогресу за перемогу':''}</div></div>`;
 if(!html)html='<div class="gm-empty">Поки що немає матчів. Запроси друга за ніком, щоб почати.</div>';
 list.innerHTML=html;
}
async function refreshMatches(){if(!MINI_TYPE||!['cookie','guess'].includes(MINI_TYPE))return;const result=await call('matchList');if(!result)return;if(result.me)upd(result.me);if(MINI_TYPE)renderMatchCards(result.matches||[],MINI_TYPE)}

ton class="btn" onclick="repayLoan(${d.id})">Погасити кредит</button>${d.status==='grace'?`<button class="btn g" onclick="remindLoan(${d.id})">Нагадати через 1 год.</button>`:''}</div>`:''}</div>`}).join('')||blocked+'<div class="mu">Поки що немає заявок або кредитів.</div>'}

async function registerWebPush(){
 if(!('Notification' in window)||!('serviceWorker' in navigator))return false;
 const permission=Notification.permission==='granted'?'granted':await Notification.requestPermission();
 if(permission!=='granted')return false;
 try{
  const registration=await navigator.serviceWorker.register('/sw.js');
  const health=await fetch('/api').then(r=>r.json());
  if(health.vapidPublicKey&&registration.pushManager){
   let key=health.vapidPublicKey.replace(/-/g,'+').replace(/_/g,'/');key+='='.repeat((4-key.length%4)%4);const appKey=Uint8Array.from(atob(key),c=>c.charCodeAt(0));
   let subscription=await registration.pushManager.getSubscription();
   if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:appKey});
   await api('pushRegister',{subscription:subscription.toJSON()});
   PUSH_AVAILABLE=health.pushEnabled===true;
  }
  return true;
 }catch(error){PUSH_AVAILABLE=false;console.warn('Push setup unavailable:',error);return true}
}
async function finishNotificationOnboarding(enable){if(enable){const allowed=await registerWebPush();toast(allowed?'Сповіщення увімкнено':'Браузер не надав дозвіл на сповіщення')}else toast('Налаштування сповіщень можна змінити пізніше');$('#consentGate')?.remove();shell();go('home')}
async function enableNotificationsSettings(){const allowed=await registerWebPush();toast(allowed?'Сповіщення увімкнено':'Не вдалося увімкнути сповіщення. Перевір дозволи браузера.')}
function showNoticePanel(messages){const layer=$('#noticeLayer');if(!layer||!messages?.length)return;layer.innerHTML=`<div class="notice-box"><div class="row" style="justify-content:space-between;align-items:center;margin:0 0 10px"><h2>🔔 Сповіщення</h2><button class="btn g" onclick="closeNoticePanel()">Закрити</button></div>${messages.map(m=>`<div class="notice-item"><b>${esc(m.sender)}</b><div>${esc(m.message)}</div><small>${new Date(m.created_at).toLocaleString('uk-UA')}</small></div>`).join('')}</div>`;layer.classList.add('on')}
function closeNoticePanel(){const layer=$('#noticeLayer');if(layer){layer.classList.remove('on');layer.innerHTML=''}}
async function pollNotifications(){if(!TK||NOTICE_BUSY||!$('#noticeLayer'))return;NOTICE_BUSY=true;try{const r=await api('messages');const rows=r.messages||[];if(rows.length){if(document.hidden&&'Notification'in window&&Notification.permission==='granted'&&!PUSH_AVAILABLE){for(const m of rows.slice(0,4)){if(navigator.serviceWorker?.controller){const reg=await navigator.serviceWorker.ready;reg.showNotification(m.sender,{body:m.message,icon:'/assets/icon-192.png',tag:'afk-fallback-'+m.id})}else new Notification(m.sender,{body:m.message})}}else showNoticePanel(rows)}}catch(e){console.warn('Notification poll:',e.message)}finally{NOTICE_BUSY=false}}

async function logout(){await call('logout');out()}

async function loadCases(){const r=await call('caseCatalog');const root=$('#caseGrid');if(!r||!root)return;root.innerHTML=(r.cases||[]).map(x=>`<article class="case-card"><img src="${caseImageSrc(x.art)}" loading="lazy" alt="${esc(x.rarity)} комплект"><div class="case-copy"><span class="tag">${esc(x.rarity)} · 100% гарантія</span><h2>${esc(x.name)}</h2><p class="mu">${esc(x.description)}</p><div class="case-reward">🚘 ${esc(x.car)}</div><div class="stat"><span class="mu">Вартість</span><b>${f(x.price)} грн</b></div><div class="mu">Автомобіль каталожною вартістю ${f(x.carValue)} грн. Результат фіксований.</div><button class="btn" style="width:100%;margin-top:10px" ${x.owned?'disabled':''} onclick="buyCase('${esc(x.id)}')">${x.owned?'Уже в гаражі':'Придбати та відкрити'}</button></div></article>`).join('')||'<div class="mu">Колекції поки недоступні.</div>'}
async function buyCase(id){const r=await call('caseBuy',{id});if(!r)return;upd(r.me);await loadCases();const item=r.case;modalBase('case','📦',item.rarity,'Гарантований результат · комплект відкривається',`<section class="gm-panel case-reveal"><img class="case-open-image" src="${caseImageSrc(item.art)}" alt=""><div class="tag">КОМПЛЕКТ ВІДКРИТО</div><div class="gm-title">${esc(item.car)}</div><div class="gm-sub">Ти отримав автомобіль каталожною вартістю ${f(item.carValue)} грн.</div><img class="case-reveal-car" src="${carImageSrc(item.car)}" alt="${esc(item.car)}"><div class="gm-result">Оплачено: ${f(item.price)} грн · результат був відомий до покупки</div><div class="gm-actions"><button class="btn" onclick="closeMiniGame();go('inv')">Відкрити гараж</button><button class="btn g" onclick="closeMiniGame()">До гри</button></div></section>`);toast('📦 Комплект отримано: '+r.car);renderCars($('#carSearch')?.value||'')}
function renderCars(filter=''){const target=$('#carGrid');if(!target)return;const query=filter.trim().toLocaleLowerCase('uk-UA');const list=D.cars.filter(car=>car.name.toLocaleLowerCase('uk-UA').includes(query));target.innerHTML=list.map(car=>{const owned=M.cars.some(item=>item.name===car.name);return`<div class="card"><img class="car-photo" loading="lazy" src="${carImageSrc(car.name)}" alt="${esc(car.name)}"><h2>${esc(car.name)}</h2><div class="num" style="color:var(--go);font-size:17px">${f(car.value)} грн</div><div class="mu">Фіксована ціна · фото відповідає марці/класу авто</div><div class="row"><button class="btn ${owned?'g':''}" ${owned?'disabled':''} data-name="${esc(car.name)}" onclick="purchaseCar(this.dataset.name)">${owned?'Уже в гаражі':'Купити'}</button></div></div>`}).join('')||'<div class="card mu">За таким запитом автомобілів не знайдено.</div>'}



(async()=>{if(!TK){auth();return}try{const result=await api('me');upd(result.me);shell();go('home');if('Notification'in window&&Notification.permission==='granted')registerWebPush();setInterval(async()=>{if(!TK||document.hidden)return;try{const fresh=await api('me');const wasPresident=M?.isPresident;upd(fresh.me);if(wasPresident!==M.isPresident&&cur==='president'&&!M.isPresident)go('country')}catch(e){}},60000)}catch(error){if(!String(error.message).includes('Сесія'))toast(error.message);auth()}})();
</script></body></html>
