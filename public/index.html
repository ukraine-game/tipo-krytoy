 await sleep(3300);if(MINI_TYPE!=='roulette'||!$('#gmMain'))return;const finished=await call('gamesFinish',{id:challengeId});if(!finished)return;upd(finished.me);const r=finished.result;
 const color=r.color==='red'?'червоне':r.color==='black'?'чорне':'зелене';const parity=r.number===0?'нуль':r.number%2?'непарне':'парне';const range=r.number===0?'нуль':r.number<=18?'1–18':'19–36';
 $('#gmMain').innerHTML=`<section class="gm-panel"><div class="gm-title">${finished.correct?'✨ Прогноз збігся!':'Раунд завершено'}</div><div class="roulette-stage"><div class="wheel"><div class="wheel-core">${r.number}</div></div></div><div class="gm-result">${r.number} · ${color} · ${parity} · ${range}</div><div class="gm-points">${finished.correct?'+'+finished.points+' очок прогресу':'Спробуй інший рівень'}</div><div class="gm-actions"><button class="btn" onclick="renderRouletteSetup()">Ще один раунд</button><button class="btn g" onclick="closeMiniGame()">Закрити</button></div></section>`;ACTIVE_GAME=null;window.ROULETTE_PREDICTION=''}
function setRoulettePrediction(value){window.ROULETTE_PREDICTION=value;document.querySelectorAll('#gmMain .gm-choice').forEach(btn=>{btn.classList.toggle('selected',btn.textContent.toLowerCase().includes(value==='red'?'черв':value==='black'?'чор':value==='even'?'парне':value==='odd'?'непарне':value==='low'?'1–18':'19–36'))})}
function renderMatchShell(type){const cookie=type==='cookie';modalBase(type,cookie?'🍪':'🔢',cookie?'Печенька':'Вгадай число',cookie?'Матч із другом · 60 секунд':'Тактика · 1–30',`<section class="gm-panel"><div class="gm-title">${cookie?'Змагайся на швидкість':'Хто першим знайде число?'}</div><p class="gm-sub">${cookie?'Введи нік друга та надішли запрошення. Після прийняття у вас буде 60 секунд.':'Надішли запрошення другу. Ви по черзі вгадуватимете число від 1 до 30 за підказками.'}</p><div class="row" style="max-width:500px;margin:20px auto 0"><input id="challengeNick" placeholder="Нік друга" autocomplete="off"><button class="btn" onclick="createMatch('${type}')">Кинути виклик</button></div></section><section class="gm-panel"><div class="gm-brand" style="justify-content:space-between"><div><h2>${cookie?'Запрошення та матчі':'Твої матчі'}</h2><div class="mu">Список оновлюється автоматично</div></div><button class="btn g" onclick="refreshMatches()">↻ Оновити</button></div><div class="gm-match-list" id="matchList"><div class="gm-empty">Завантаження…</div></div></section>`)}
async function createMatch(game){const nick=$('#challengeNick')?.value?.trim();const result=await call('matchCreate',{game,nick});if(result){toast('Запрошення надіслано гравцю '+result.opponent);$('#challengeNick').value='';refreshMatches()}}
async function respondMatch(id,action){const result=await call('matchRespond',{id,action});if(result){toast(action==='accept'?'Матч почався!':'Запрошення відхилено');refreshMatches()}}
function renderMatchCards(matches,type){const list=$('#matchList');if(!list)return;matches=matches.filter(x=>x.game===type);const gameName=type==='cookie'?'Печенька':'Вгадай число';
 let html='';
 for(const m of matches.filter(x=>x.status==='pending'&&x.incoming))html+=`<div class="match-card"><b>📩 Запрошення · ${gameName} #${m.id}</b><div class="mu">Від гравця ${esc(m.creator)}</div><div class="row"><button class="btn" onclick="respondMatch(${m.id},'accept')">Прийняти</button><button class="btn g" onclick="respondMatch(${m.id},'reject')">Відхилити</button></div></div>`;
 for(const m of matches.filter(x=>x.status==='pending'&&!x.incoming))html+=`<div class="match-card"><b>⏳ Запрошення #${m.id} надіслано</b><div class="mu">Очікуємо відповідь від ${esc(m.opponent)}</div></div>`;
 for(const m of matches.filter(x=>x.status==='active')){
   if(type==='cookie'){
     const left=Math.max(0,Math.ceil((new Date(m.endsAt).getTime()-Date.now())/1000));
     html+=`<div class="match-card"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>🍪 Матч #${m.id}</b><span class="tag">${left} с</span></div><div class="cookie-arena"><div class="score-box"><span class="mu">Ти</span><b>${m.myScore}</b></div><div class="score-box"><span class="mu">${esc(m.creatorMe?m.opponent:m.creator)}</span><b>${m.otherScore}</b></div></div><div style="text-align:center"><button class="cookie-button" ${left<=0?'disabled':''} onclick="tapCookie(${m.id},this)">🍪</button><p class="gm-note">Тапай по печеньці якомога швидше!</p></div></div>`;
   }else{
     const turn=m.myTurn?'<span class="ok">Твій хід</span>':'Хід суперника';
     html+=`<div class="match-card"><div class="row" style="justify-content:space-between;margin:0"><b>🔢 Матч #${m.id}</b><span class="tag">${turn}</span></div><div class="mu" style="margin-top:8px">${m.myTurn?'Обери число від 1 до 30.':'Суперник думає над числом…'}</div><div class="gm-result" style="font-size:16px">${esc(MATCH_HINT[m.id]||'')||'Підказки з’являться після спроби.'}</div><div class="number-grid">${Array.from({length:30},(_,i)=>i+1).map(n=>`<button ${!m.myTurn?'disabled':''} onclick="guessMatchNumber(${m.id},${n})">${n}</button>`).join('')}</div></div>`;
   }
 }
 for(const m of matches.filter(x=>x.status==='completed'))html+=`<div class="match-card"><b>${m.game==='cookie'?'🍪':'🔢'} Матч #${m.id} · завершено</b><div class="mu">${m.winner?'Переможець: '+esc(m.winner):'Нічия'}</div>${m.game==='cookie'?`<div class="mu">Рахунок: ${m.myScore} : ${m.otherScore}</div>`:''}<div class="gm-note">${m.winner===M.nick?'+5 очок прогресу за перемогу':''}</div></div>`;
 if(!html)html='<div class="gm-empty">Поки що немає матчів. Запроси друга за ніком, щоб почати.</div>';
 list.innerHTML=html;
}
async function refreshMatches(){if(!MINI_TYPE||!['cookie','guess'].includes(MINI_TYPE))return;const result=await call('matchList');if(!result)return;if(result.me)upd(result.me);if(MINI_TYPE)renderMatchCards(result.matches||[],MINI_TYPE)}
async function tapCookie(id,button){const myScore=button?.closest('.match-card')?.querySelector('.cookie-arena .score-box:first-child b');if(myScore)myScore.textContent=String((Number(myScore.textContent)||0)+1);button?.classList.remove('cookie-tap');void button?.offsetWidth;button?.classList.add('cookie-tap');await call('cookieTap',{id});setTimeout(()=>button?.classList.remove('cookie-tap'),160);}
async function guessMatchNumber(id,guess){const result=await call('guessMatch',{id,guess});if(!result)return;if(result.me)upd(result.me);MATCH_HINT[id]=result.won?'🎉 Ти знайшов число! +5 очок прогресу':result.hint==='higher'?'Підказка: потрібне число більше ↑':'Підказка: потрібне число менше ↓';if(result.won){MATCH_HINT[id]='🎉 Ти знайшов число! +5 очок прогресу';toast('Перемога! +5 очок прогресу')}refreshMatches()}
async function startGame(game){const result=await call('gamesStart',{game});if(!result)return;ACTIVE_GAME=result.challenge;renderStandardChallenge()}
function renderStandardChallenge(){if(!ACTIVE_GAME)return;const c=ACTIVE_GAME,game=c.game,title={math:'🧮 Розв’яжи приклад',memory:'🧠 Запам’ятай послідовність',number:'🔢 Вгадай число'}[game];modalBase(game,game==='math'?'🧮':'🧠',title,'Серверне завдання · одне використання',`<section class="gm-panel"><div class="gm-title">${title}</div><p class="gm-sub" id="gameHint">${game==='memory'?'Запам’ятай послідовність за 4 секунди.':'Виконай завдання та надішли відповідь.'}</p><div class="game-seq" id="gamePrompt">${esc(c.prompt)}</div><div class="row" style="max-width:520px;margin:18px auto"><input id="gameAnswer" class="gm-input" autocomplete="off" placeholder="${game==='memory'?'Шість цифр':'Твоя відповідь'}" ${game==='memory'?'disabled':''}><button class="btn" onclick="finishGame()">Перевірити</button></div></section>`);if(game==='memory'){setTimeout(()=>{const p=$('#gamePrompt'),i=$('#gameAnswer'),h=$('#gameHint');if(p)p.textContent='? ? ? ? ? ?';if(i)i.disabled=false;if(h)h.textContent='Час відтворити послідовність. Введи шість цифр без пробілів.'},4000)}}
async function finishGame(){if(!ACTIVE_GAME)return;const game=ACTIVE_GAME.game;const result=await call('gamesFinish',{id:ACTIVE_GAME.id,answer:$('#gameAnswer')?.value??''});if(result){upd(result.me);$('#gmMain').innerHTML=`<section class="gm-panel"><div class="gm-title">${result.correct?'✅ Правильно!':'↩️ Завдання завершено'}</div><div class="gm-points">+${result.points} очок прогресу</div><p class="gm-sub">${result.correct?'Результат зараховано до прогресу.':'Цього разу без очок. Спробуй ще раз.'}</p><div class="gm-actions"><button class="btn" onclick="startGame('${game}')">Ще раз</button><button class="btn g" onclick="closeMiniGame()">Закрити</button></div></section>`;ACTIVE_GAME=null}}
async function loadBank(){const result=await call('bankList');if(!result||!$('#bankDeals'))return;const root=$('#bankDeals');root.innerHTML=(result.bankBlocked?'<div class="err">Доступ до нових банківських операцій заблоковано адміністратором. Перегляд і погашення наявних кредитів доступні.</div>':'')+result.deals.map(d=>{const meLender=d.lender===M.nick;const status={pending:'Очікує відповіді',active:'Активний',overdue:'Прострочений',paid:'Погашений',rejected:'Відхилений',countered:'Зустрічна пропозиція'}[d.status]||d.status;return`<div class="card" style="margin:10px 0"><div class="row" style="justify-content:space-between;align-items:center;margin-top:0"><b>#${d.id} · ${meLender?'Ти кредитор':'Ти позичальник'}</b><span class="tag">${status}</span></div>${stat('Кредитор',esc(d.lender))}${stat('Позичальник',esc(d.borrower))}${stat('Основна сума',f(d.principal)+' грн')}${stat('Відсоток / строк',d.rate+'% · '+d.days+' дн.')}${d.status==='active'||d.status==='overdue'?stat('До сплати',f(d.totalDue)+' грн'+(d.penalty?' (штраф '+f(d.penalty)+')':'')):''}${d.dueAt?stat('Термін',new Date(d.dueAt).toLocaleString('uk-UA')):''}${d.status==='pending'&&d.recipientMe?`<div class="row"><button class="btn" onclick="loanAction(${d.id},'accept')">Прийняти</button><button class="btn g" onclick="loanAction(${d.id},'reject')">Відхилити</button></div><div class="row"><input id="counterAmount${d.id}" type="number" placeholder="Нова сума"><input id="counterRate${d.id}" type="number" step="0.1" placeholder="%"><input id="counterDays${d.id}" type="number" min="1" max="10" placeholder="Днів"><button class="btn g" onclick="loanAction(${d.id},'counter')">Контрпропозиція</button></div>`:''}${(d.status==='active'||d.status==='overdue')&&!meLender?`<div class="row"><button class="btn" onclick="repayLoan(${d.id})">Погасити кредит</button></div>`:''}</div>`}).join('')||'<div class="mu">Поки що немає заявок або кредитів.</div>'}
async function createLoan(kind){if(M.bankBlocked){toast('Доступ до банку заблоковано');return}const result=await call('bankCreate',{kind,nick:$('#bankNick').value,amount:Number($('#bankAmount').value),rate:Number($('#bankRate').value),days:Number($('#bankDays').value)});if(result){toast('✅ Заявку створено');loadBank()}}
async function loanAction(id,action){const payload={id,action};if(action==='counter'){payload.amount=Number($('#counterAmount'+id).value);payload.rate=Number($('#counterRate'+id).value);payload.days=Number($('#counterDays'+id).value)}const result=await call('bankRespond',payload);if(result){upd(result.me);toast('✅ Банківську дію виконано');loadBank()}}
async function repayLoan(id){const result=await call('bankPay',{id});if(result){upd(result.me);toast('✅ Кредит погашено: '+f(result.paid)+' грн');loadBank()}}
let MARKET_DATA=null;
async function loadMarket(){const result=await call('marketList');if(!result)return;MARKET_DATA=result;refreshMarketAssets();const out=$('#marketListings');if(out)out.innerHTML=result.listings.map(x=>`<div class="card" style="margin:8px 0"><b>${esc(x.name)}</b><div class="mu">${esc(x.seller)} · ${x.type==='car'?'Автомобіль':x.type==='house'?'Нерухомість':'Бізнес'}</div><div class="num" style="font-size:18px;color:var(--go);margin:8px 0">${f(x.price)} грн</div><button class="btn" onclick="buyListing(${x.id})">Купити</button></div>`).join('')||'<div class="mu">Активних оголошень немає.</div>';const own=$('#marketOwn');if(own)own.innerHTML=`<div class="mu">Твій гараж: ${result.own.cars.length} авто · ${result.own.house?'є нерухомість':'без нерухомості'} · ${result.own.biz?'є бізнес':'без бізнесу'} ${result.own.protected?'· захист гаража активний':''}</div>`+(result.ownListings||[]).map(x=>`<div class="stat"><span>${esc(x.name)} · ${f(x.price)} грн</span><button class="btn g" onclick="cancelListing(${x.id})">Зняти</button></div>`).join('')}
function refreshMarketAssets(){const type=$('#marketType')?.value||'car',select=$('#marketAsset');if(!select||!MARKET_DATA)return;let options=[];if(type==='car')options=MARKET_DATA.own.cars.map(x=>`<option value="${x.id}">${esc(x.name)} (#${x.id})</option>`);if(type==='house'&&MARKET_DATA.own.house)options=[`<option value="">${esc(MARKET_DATA.own.house)}</option>`];if(type==='biz'&&MARKET_DATA.own.biz)options=[`<option value="">${esc(MARKET_DATA.own.biz)}</option>`];select.innerHTML=options.join('')||'<option value="">Немає доступного майна</option>'}
async function createListing(){const result=await call('marketCreate',{type:$('#marketType').value,assetId:Number($('#marketAsset').value),price:Number($('#marketPrice').value)});if(result){toast('✅ Оголошення створено');loadMarket()}}
async function buyListing(id){const result=await call('marketBuy',{id});if(result){upd(result.me);toast('✅ Майно придбано');loadMarket()}}
async function cancelListing(id){const result=await call('marketCancel',{id});if(result){toast('Оголошення знято з ринку');loadMarket()}}
async function garageProtect(){const result=await call('garageProtect');if(result){upd(result.me);go('inv')}}
async function loadRoles(){const result=await call('roleList');if(!result)return;const own=$('#ownRoles'),shop=$('#roleListings');if(own)own.innerHTML=result.own.map(r=>`<div class="car"><span><b>${esc(r.name)}</b><div class="mu">${r.listed?'На ринку · '+f(r.price)+' грн':'Не виставлена'} ${result.active===r.name?'· Активна':''}</div></span><div class="row" style="margin:0"><button class="btn g" onclick="activateRole(${r.id})">Обрати</button><input id="rolePrice${r.id}" type="number" min="1" placeholder="Ціна" style="width:110px"><button class="btn" onclick="sellRole(${r.id})">Продати</button></div></div>`).join('')||'<div class="mu">Ти ще не створив ролей.</div>';if(shop)shop.innerHTML=result.roles.map(r=>`<div class="card" style="margin:8px 0"><b>${esc(r.name)}</b><div class="mu">Автор: ${esc(r.seller)}</div><div class="num" style="font-size:18px;color:var(--go);margin:8px 0">${f(r.price)} грн</div><button class="btn" onclick="buyRole(${r.id})">Придбати</button></div>`).join('')||'<div class="mu">Поки що немає виставлених ролей.</div>'}
async function createRole(){const result=await call('roleCreate',{name:$('#roleName').value});if(result){upd(result.me);toast('✅ Косметичну роль створено');loadRoles()}}
async function activateRole(id){const result=await call('roleActivate',{id});if(result){upd(result.me);toast('✅ Титул змінено');loadRoles()}}
async function sellRole(id){const result=await call('roleSell',{id,price:Number($('#rolePrice'+id).value)});if(result){toast('✅ Роль виставлена на продаж');loadRoles()}}
async function buyRole(id){const result=await call('roleBuy',{id});if(result){upd(result.me);toast('✅ Роль придбано');loadRoles()}}
async function redeemPromo(){const result=await call('promoRedeem',{code:$('#promoCode').value});if(result){upd(result.me);toast('🎟️ Промокод активовано: +'+f(result.reward)+' грн')}}
async function loadMessages(){const result=await call('messages');if(!result)return;const box=$('#messagesList');if(box)box.innerHTML=result.messages.map(m=>`<div class="card" style="margin:8px 0"><div class="row" style="justify-content:space-between;margin:0"><b>${esc(m.sender)}</b><span class="mu">${new Date(m.created_at).toLocaleString('uk-UA')}</span></div><p style="margin-top:10px">${esc(m.message)}</p></div>`).join('')||'<div class="mu">Повідомлень поки немає.</div>'}
async function claimBusiness(){const result=await call('businessClaim');if(result){upd(result.me);toast('🏢 Дохід отримано: +'+f(result.income)+' грн');go('biz')}}
async function logout(){await call('logout');out()}

function renderCars(filter=''){const target=$('#carGrid');if(!target)return;const query=filter.trim().toLocaleLowerCase('uk-UA');const list=D.cars.filter(car=>car.name.toLocaleLowerCase('uk-UA').includes(query));target.innerHTML=list.map(car=>{const owned=M.cars.some(item=>item.name===car.name);return`<div class="card"><h2>${esc(car.name)}</h2><div class="num" style="color:var(--go);font-size:17px">${f(car.value)} грн</div><div class="mu">Фіксована ціна · без випадкових нагород</div><div class="row"><button class="btn ${owned?'g':''}" ${owned?'disabled':''} data-name="${esc(car.name)}" onclick="purchaseCar(this.dataset.name)">${owned?'Уже в гаражі':'Купити'}</button></div></div>`}).join('')||'<div class="card mu">За таким запитом автомобілів не знайдено.</div>'}



(async()=>{if(!TK){auth();return}try{const result=await api('me');upd(result.me);shell();go('home')}catch(error){if(!String(error.message).includes('Сесія'))toast(error.message);auth()}})();
</script></body></html>
